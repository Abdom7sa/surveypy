<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>SurveyPy - Interactive Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f8f9fa; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .metrics { display: flex; gap: 20px; flex-wrap: wrap; }
        .metric-box { background: #ecf0f1; padding: 15px; border-radius: 6px; flex: 1; min-width: 180px; }
        .metric-title { font-size: 0.9em; color: #7f8c8d; }
        .metric-val { font-size: 1.4em; font-weight: bold; color: #2c3e50; margin-top: 5px; }
        svg { background: #ffffff; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>📌 SurveyPy - التقرير التفاعلي للحسابات المساحية</h1>
    <div class="metrics">
        <div class="metric-box"><div class="metric-title">خطأ الإغلاق الكلي (Linear Error)</div><div class="metric-val">18.3400 m</div></div>
        <div class="metric-box"><div class="metric-title">نسبة الدقة (Precision Ratio)</div><div class="metric-val">1 : 24</div></div>
        <div class="metric-box"><div class="metric-title">المساحة المحسوبة</div><div class="metric-val">12432.59 m²</div></div>
    </div>
    <div class="card" style="margin-top: 20px;">
        <h2>المعاينه التفاعلية للمضلع المساحي</h2>
        <svg width="550" height="500">
            <polyline points="50.0,257.5774255159529 257.3513348996015,50.0 450.0,136.85980220928064 256.25827717144386,450.0 50.0,257.57742551595317" fill="none" stroke="#3498db" stroke-width="2" />
            <circle cx="50.0" cy="257.5774255159529" r="5" fill="#e74c3c" /><text x="58.0" y="249.57742551595288" font-size="12" fill="#2c3e50">(1000.0, 1000.0)</text><circle cx="257.3513348996015" cy="50.0" r="5" fill="#e74c3c" /><text x="265.3513348996015" y="42.0" font-size="12" fill="#2c3e50">(1081.8, 1081.8)</text><circle cx="450.0" cy="136.85980220928064" r="5" fill="#e74c3c" /><text x="458.0" y="128.85980220928064" font-size="12" fill="#2c3e50">(1157.9, 1047.6)</text><circle cx="256.25827717144386" cy="450.0" r="5" fill="#e74c3c" /><text x="264.25827717144386" y="442.0" font-size="12" fill="#2c3e50">(1081.4, 924.2)</text><circle cx="50.0" cy="257.57742551595317" r="5" fill="#e74c3c" /><text x="58.0" y="249.57742551595317" font-size="12" fill="#2c3e50">(1000.0, 1000.0)</text>
        </svg>
    </div>
</body>
</html>
